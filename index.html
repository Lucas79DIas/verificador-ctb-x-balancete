<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificador CTB x Balancete</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --accent: #4a5cf0;
    --accent-light: #eef0fe;
    --bg: #f7f8fc;
    --card: #ffffff;
    --border: #e7e9f3;
    --text: #1c2130;
    --text-muted: #6b7280;
    --red: #dc3545;
    --red-bg: #fdecec;
    --green: #1a9e5c;
    --green-bg: #eafaf1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  header p { color: var(--text-muted); margin: 0; font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) { .upload-grid { grid-template-columns: 1fr; } }

  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover { border-color: var(--accent); background: var(--accent-light); }
  .drop.filled { border-color: var(--green); background: var(--green-bg); }
  .drop .label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .drop .sub { font-size: 12px; color: var(--text-muted); }
  .drop input { display: none; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 18px;
    transition: opacity .15s;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: .9; }

  .error-box {
    background: var(--red-bg);
    color: var(--red);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 8px;
  }
  @media (max-width: 640px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    border-radius: 12px;
    padding: 14px 16px;
    background: var(--accent-light);
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .stat.ok { background: var(--green-bg); }
  .stat.ok .n { color: var(--green); }
  .stat.bad { background: var(--red-bg); }
  .stat.bad .n { color: var(--red); }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 28px 0 4px;
  }
  .section-sub {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.diff td.num.delta { color: var(--red); font-weight: 700; }
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: var(--red-bg);
    color: var(--red);
  }
  .empty-ok {
    padding: 20px;
    text-align: center;
    color: var(--green);
    font-weight: 600;
    background: var(--green-bg);
    border-radius: 12px;
    font-size: 14px;
  }
  .loading { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--card);
    color: var(--accent);
    border: 1.5px solid var(--accent);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin: 4px 0 18px;
  }
  .btn-secondary:hover { background: var(--accent-light); }

  #printTitle { display: none; }

  @media print {
    body { padding: 0; background: white; }
    .no-print { display: none !important; }
    #printTitle { display: block; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    #printDate { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
    .card { border: none; padding: 0; border-radius: 0; }
    .section-title { break-after: avoid; }
    table { break-inside: auto; }
    tr { break-inside: avoid; }
    .empty-ok { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="no-print">
    <h1>Verificador CTB x Balancete</h1>
    <p>Confere, por conta financeira e fonte de recurso, se o saldo final do CTB (registro 20) bate com o saldo final agrupado do Balancete (registro 17).</p>
  </header>
  <div id="printTitle">Verificador CTB x Balancete — Relatório de divergências</div>
  <div id="printDate"></div>

  <div class="card no-print">
    <div class="upload-grid">
      <label class="drop" id="dropAM">
        <div class="label" id="labelAM">📁 ZIP do AM</div>
        <div class="sub" id="subAM">contém CTB.CSV — clique ou arraste aqui</div>
        <input type="file" id="fileAM" accept=".zip">
      </label>
      <label class="drop" id="dropBAL">
        <div class="label" id="labelBAL">📁 ZIP do Balancete</div>
        <div class="sub" id="subBAL">contém BALANCETE.CSV — clique ou arraste aqui</div>
        <input type="file" id="fileBAL" accept=".zip">
      </label>
    </div>
    <button class="btn" id="btnRun" disabled>Verificar</button>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div id="results"></div>
</div>

<script>
const state = { am: null, bal: null };

function fmt(n) {
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function toFloat(s) {
  s = (s || '').trim();
  if (!s) return 0;
  return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
}

function normConta(s) {
  const n = (s || '').trim().replace(/^0+/, '');
  return n === '' ? '0' : n;
}

async function readZipEntry(file, matchFn) {
  const zip = await JSZip.loadAsync(file);
  const names = Object.keys(zip.files);
  const target = names.find(matchFn);
  if (!target) return null;
  const buf = await zip.files[target].async('arraybuffer');
  return new TextDecoder('iso-8859-1').decode(buf);
}

function setupDrop(dropId, fileId, labelId, subId, kind) {
  const drop = document.getElementById(dropId);
  const input = document.getElementById(fileId);
  const label = document.getElementById(labelId);
  const sub = document.getElementById(subId);

  function handleFile(f) {
    if (!f) return;
    state[kind] = f;
    drop.classList.add('filled');
    label.textContent = '✅ ' + f.name;
    sub.textContent = 'arquivo carregado — clique para trocar';
    checkReady();
  }

  input.addEventListener('change', e => handleFile(e.target.files[0]));
  drop.addEventListener('dragover', e => { e.preventDefault(); });
  drop.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

function checkReady() {
  document.getElementById('btnRun').disabled = !(state.am && state.bal);
}

setupDrop('dropAM', 'fileAM', 'labelAM', 'subAM', 'am');
setupDrop('dropBAL', 'fileBAL', 'labelBAL', 'subBAL', 'bal');

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = msg;
}
function hideError() {
  document.getElementById('errorBox').style.display = 'none';
}

// Contas contábeis excluídas do grupo 1.1.1 (CEC 1) e regra do grupo 1113 (CEC 3)
const EXCECOES_111 = new Set(['111110100', '111110200', '111210100']); // 1.1.1.1.1.01.00 / .02.00 / 1.1.1.2.1.01.00

function chave(contaFin, fonte) {
  return contaFin + '|' + fonte;
}

function parseCTB(text) {
  const cec1 = new Map();
  const cec3 = new Map();
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.startsWith('20;')) continue;
    const p = line.split(';');
    // 20;orgao;contaFinanceira;fonte;saldoCEC;saldoInicial;saldoFinal
    const contaFin = normConta(p[2]);
    const fonte = (p[3] || '').trim();
    const cec = (p[4] || '').trim();
    const saldoFinal = toFloat(p[6]);
    const k = chave(contaFin, fonte);
    if (cec === '1') cec1.set(k, (cec1.get(k) || 0) + saldoFinal);
    else if (cec === '3') cec3.set(k, (cec3.get(k) || 0) + saldoFinal);
  }
  return { cec1, cec3 };
}

function parseBalancete(text) {
  const g111 = new Map(); // 1.1.1, exceto exceções e exceto 1113
  const g1113 = new Map(); // 1113
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.startsWith('17;')) continue;
    const p = line.split(';');
    // 17;contaContabil;complemento;atributoFin;contaFinanceira;fonte;CO;saldoInicial;natSaldo;debito;credito;saldoFinal;natFinal
    const contaContabil = (p[1] || '').trim();
    const contaFin = normConta(p[4]);
    const fonte = (p[5] || '').trim();
    const saldoFinal = toFloat(p[11]);
    const natFinal = (p[12] || '').trim();
    const signed = natFinal === 'C' ? -saldoFinal : saldoFinal;
    // CO (p[6]) é ignorado de propósito no acumulado por conta financeira + fonte
    const k = chave(contaFin, fonte);

    if (contaContabil.startsWith('1113')) {
      g1113.set(k, (g1113.get(k) || 0) + signed);
    } else if (contaContabil.startsWith('111') && !EXCECOES_111.has(contaContabil)) {
      g111.set(k, (g111.get(k) || 0) + signed);
    }
  }
  return { g111, g1113 };
}

function compare(ctbMap, balMap) {
  const keys = new Set([...ctbMap.keys(), ...balMap.keys()]);
  const rows = [];
  for (const k of keys) {
    const [conta, fonte] = k.split('|');
    const vCtb = Math.round((ctbMap.get(k) || 0) * 100) / 100;
    const vBal = Math.round((balMap.get(k) || 0) * 100) / 100;
    const delta = Math.round((vCtb - vBal) * 100) / 100;
    rows.push({ conta, fonte, ctb: vCtb, bal: vBal, delta, ok: Math.abs(delta) <= 0.01 });
  }
  rows.sort((a, b) => a.conta.localeCompare(b.conta, undefined, { numeric: true }) || a.fonte.localeCompare(b.fonte));
  return rows;
}

function renderTable(rows, title, sub) {
  const diffRows = rows.filter(r => !r.ok);
  let html = `<div class="section-title">${title}</div><div class="section-sub">${sub}</div>`;

  if (diffRows.length === 0) {
    html += `<div class="empty-ok">✅ Todos os ${rows.length} pares conta financeira + fonte batem</div>`;
    return html;
  }

  html += `<table><thead><tr>
    <th>Conta financeira</th>
    <th>Fonte</th>
    <th class="num">Saldo CTB</th>
    <th class="num">Saldo Balancete</th>
    <th class="num">Diferença</th>
  </tr></thead><tbody>`;
  for (const r of diffRows) {
    html += `<tr class="diff">
      <td>${r.conta} <span class="pill">divergente</span></td>
      <td>${r.fonte}</td>
      <td class="num">${fmt(r.ctb)}</td>
      <td class="num">${fmt(r.bal)}</td>
      <td class="num delta">${fmt(r.delta)}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

document.getElementById('btnRun').addEventListener('click', async () => {
  hideError();
  const results = document.getElementById('results');
  results.innerHTML = '<div class="loading">Lendo arquivos e verificando…</div>';

  try {
    const ctbText = await readZipEntry(state.am, n => /CTB\.CSV$/i.test(n));
    if (!ctbText) throw new Error('Não encontrei um arquivo CTB.CSV dentro do ZIP do AM.');

    const balText = await readZipEntry(state.bal, n => /BALANCETE\.CSV$/i.test(n));
    if (!balText) throw new Error('Não encontrei um arquivo BALANCETE.CSV dentro do ZIP do Balancete.');

    const { cec1, cec3 } = parseCTB(ctbText);
    const { g111, g1113 } = parseBalancete(balText);

    const rows1 = compare(cec1, g111);
    const rows3 = compare(cec3, g1113);

    const diff1 = rows1.filter(r => !r.ok).length;
    const diff3 = rows3.filter(r => !r.ok).length;
    const total = rows1.length + rows3.length;
    const totalDiff = diff1 + diff3;

    let html = `<div class="card">
      <button class="btn-secondary no-print" id="btnPdf">⬇️ Exportar divergências em PDF</button>
      <div class="summary-grid">
        <div class="stat"><div class="n">${total}</div><div class="l">pares conta + fonte conferidos</div></div>
        <div class="stat ${totalDiff === 0 ? 'ok' : 'bad'}"><div class="n">${totalDiff}</div><div class="l">divergências encontradas</div></div>
        <div class="stat ${diff1 === 0 ? 'ok' : 'bad'}"><div class="n">${diff1}</div><div class="l">divergências CEC 1</div></div>
        <div class="stat ${diff3 === 0 ? 'ok' : 'bad'}"><div class="n">${diff3}</div><div class="l">divergências CEC 3</div></div>
      </div>
      ${renderTable(rows1, 'CEC 1 — Saldo CTB x Balancete (1.1.1, exceto exceções e 1113)', 'Contas contábeis iniciadas em 1.1.1, exceto 1.1.1.1.1.01.00, 1.1.1.1.1.02.00, 1.1.1.2.1.01.00 e todas as iniciadas em 1.1.1.3.')}
      ${renderTable(rows3, 'CEC 3 — Saldo CTB x Balancete (1113)', 'Contas contábeis iniciadas em 1.1.1.3 (código 1113).')}
    </div>`;

    results.innerHTML = html;

    document.getElementById('printDate').textContent =
      'Gerado em ' + new Date().toLocaleString('pt-BR');
    document.getElementById('btnPdf').addEventListener('click', () => window.print());
  } catch (err) {
    results.innerHTML = '';
    showError('Erro: ' + err.message);
  }
});
</script>
</body>
</html>
